name: algeria_pharma_crm_mobile
description: "Companion Field Mobile App for Algerian Pharmaceutical CRM - Offline Visit Logging, GPS Verification & Cloud Sync"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # HTTP networking & offline sync
  dio: ^5.4.0
  # Local SQLite database for 100% offline field operation
  sqflite: ^2.3.2
  path_provider: ^2.1.2
  path: ^1.9.0
  # State management & reactive architecture
  provider: ^6.1.1
  # UI & Utilities
  intl: ^0.19.0
  google_fonts: ^6.1.0
  flutter_spinkit: ^5.2.0
  # Geolocation for Algerian wilayas
  geolocator: ^10.1.0
  uuid: ^4.3.3
  shared_preferences: ^2.2.2
  lucide_icons_flutter: ^3.1.22

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
